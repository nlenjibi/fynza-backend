# =============================================================================
# Fynza — Auth GraphQL Operations
# Endpoint: POST /graphql
# Header:   Content-Type: application/json
# Header:   Authorization: Bearer <accessToken>   (on protected operations)
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# Fragments
# ─────────────────────────────────────────────────────────────────────────────

fragment AuthUserFields on AuthUser {
  id
  email
  username
  firstName
  lastName
  role
}

# Full payload when tokens are present (normal login / register / refresh)
fragment AuthPayloadFull on AuthPayload {
  accessToken
  refreshToken
  tokenType
  expiresIn
  mfaRequired
  mfaChallengeToken
  user {
    ...AuthUserFields
  }
}

# Slim payload — only carry MFA fields (used when mfaRequired = true)
fragment AuthPayloadMfa on AuthPayload {
  mfaRequired
  mfaChallengeToken
}


# =============================================================================
# 1. CORE AUTH
# =============================================================================

# Register a new account
mutation Register($input: RegisterInput!) {
  register(input: $input) {
    ...AuthPayloadFull
  }
}
# Variables:
# {
#   "input": {
#     "firstName": "Ada",
#     "lastName": "Lovelace",
#     "email": "ada@example.com",
#     "password": "MinLength8!",
#     "phone": "+233201234567",
#     "role": "CUSTOMER"
#   }
# }


# Login — check mfaRequired before storing tokens
mutation Login($input: LoginInput!) {
  login(input: $input) {
    ...AuthPayloadFull
  }
}
# Variables:
# {
#   "input": {
#     "email": "ada@example.com",
#     "password": "MinLength8!"
#   }
# }
# Note: if data.login.mfaRequired === true, tokens are null.
#       Store mfaChallengeToken and proceed to VerifyMfa.


# Refresh access + refresh tokens (rotation — old refreshToken is invalidated)
mutation RefreshToken($input: RefreshTokenInput!) {
  refreshToken(input: $input) {
    ...AuthPayloadFull
  }
}
# Variables:
# {
#   "input": {
#     "refreshToken": "eyJ..."
#   }
# }


# Logout (🔒 authenticated) — invalidates the specified session
mutation Logout($input: RefreshTokenInput!) {
  logout(input: $input)
}
# Variables:
# {
#   "input": {
#     "refreshToken": "eyJ..."
#   }
# }


# =============================================================================
# 2. EMAIL VERIFICATION
# =============================================================================

# Verify email using the token from the link in the verification email
mutation VerifyEmail($input: VerifyEmailInput!) {
  verifyEmail(input: $input)
}
# Variables:
# {
#   "input": {
#     "token": "<token from ?token= query param>"
#   }
# }


# Re-send the verification email
mutation ResendVerification($input: ResendVerificationInput!) {
  resendVerification(input: $input)
}
# Variables:
# {
#   "input": {
#     "email": "ada@example.com"
#   }
# }


# =============================================================================
# 3. PASSWORD RECOVERY
# =============================================================================

# Request a password reset email.
# Always returns true — never reveals whether the email exists.
mutation ForgotPassword($input: ForgotPasswordInput!) {
  forgotPassword(input: $input)
}
# Variables:
# {
#   "input": {
#     "email": "ada@example.com"
#   }
# }


# Consume the reset token and set a new password.
# On success all active sessions are invalidated — redirect user to login.
mutation ResetPassword($input: ResetPasswordInput!) {
  resetPassword(input: $input)
}
# Variables:
# {
#   "input": {
#     "token": "<token from ?token= query param>",
#     "newPassword": "NewPassword1!",
#     "confirmPassword": "NewPassword1!"
#   }
# }


# Change password while authenticated (🔒)
# On success all active sessions are invalidated — redirect user to login.
mutation ChangePassword($input: ChangePasswordInput!) {
  changePassword(input: $input)
}
# Variables:
# {
#   "input": {
#     "currentPassword": "OldPassword1!",
#     "newPassword": "NewPassword1!",
#     "confirmPassword": "NewPassword1!"
#   }
# }


# =============================================================================
# 4. SESSION MANAGEMENT  (🔒 authenticated)
# =============================================================================

# List all active sessions.
# Pass currentRefreshToken to flag which entry is the current device.
query ActiveSessions($currentRefreshToken: String) {
  activeSessions(currentRefreshToken: $currentRefreshToken) {
    sessionId
    deviceName
    ipAddress
    createdAt
    lastActivityAt
    expiresAt
    current
  }
}
# Variables:
# {
#   "currentRefreshToken": "eyJ..."
# }


# Revoke a specific session by ID
mutation RevokeSession($input: RevokeSessionInput!) {
  revokeSession(input: $input)
}
# Variables:
# {
#   "input": {
#     "sessionId": "uuid-of-session-to-revoke"
#   }
# }


# Revoke all other sessions — stay logged in on the current device
mutation RevokeOtherSessions($input: RevokeOtherSessionsInput!) {
  revokeOtherSessions(input: $input)
}
# Variables:
# {
#   "input": {
#     "refreshToken": "eyJ...currentRefreshToken"
#   }
# }


# =============================================================================
# 5. MFA — TOTP SETUP  (🔒 authenticated)
# =============================================================================

# Step 1: generate a TOTP secret and QR code URI.
# Render qrCodeUri as a QR image. MFA is NOT active yet.
mutation SetupMfa {
  setupMfa {
    secret
    qrCodeUri
    manualEntryCode
  }
}


# Step 2: confirm setup with the first code from the authenticator app.
# MFA is active after this succeeds.
mutation EnableMfa($input: MfaEnableInput!) {
  enableMfa(input: $input)
}
# Variables:
# {
#   "input": {
#     "totpCode": "123456"
#   }
# }


# Disable MFA — requires a valid TOTP code to prevent accidental disabling.
mutation DisableMfa($input: MfaDisableInput!) {
  disableMfa(input: $input)
}
# Variables:
# {
#   "input": {
#     "totpCode": "123456"
#   }
# }


# =============================================================================
# 6. MFA — LOGIN CHALLENGE  (public)
# =============================================================================

# Called after login returns mfaRequired: true.
# Exchanges the challenge token + TOTP code for real JWT tokens.
mutation VerifyMfa($input: MfaVerifyInput!) {
  verifyMfa(input: $input) {
    ...AuthPayloadFull
  }
}
# Variables:
# {
#   "input": {
#     "challengeToken": "<mfaChallengeToken from login response>",
#     "totpCode": "123456"
#   }
# }


# =============================================================================
# 7. SOCIAL / OAuth2 ACCOUNTS  (🔒 authenticated)
# =============================================================================

# List all OAuth2 providers linked to the current account
query LinkedAccounts {
  linkedAccounts {
    provider
    displayName
    email
    avatarUrl
    linkedAt
  }
}


# Unlink a social provider.
# Fails with an error if this is the only linked provider.
mutation UnlinkSocialAccount($provider: String!) {
  unlinkSocialAccount(provider: $provider)
}
# Variables:
# {
#   "provider": "google"   # or "github" | "facebook"
# }


# =============================================================================
# USAGE NOTES
# =============================================================================
#
# MFA login flow
# ──────────────
#   1. mutation Login  →  check data.login.mfaRequired
#      - false → store accessToken + refreshToken, done
#      - true  → store mfaChallengeToken, show TOTP input
#   2. mutation VerifyMfa  →  store accessToken + refreshToken
#
# MFA setup flow
# ──────────────
#   1. mutation SetupMfa  →  render qrCodeUri as QR, show manualEntryCode as fallback
#   2. User scans with authenticator app
#   3. mutation EnableMfa (first code from app)  →  MFA now active
#
# Token refresh strategy
# ──────────────────────
#   Proactively refresh before expiry (accessToken = 15 min, refreshToken = 7 days).
#   On any 401/UNAUTHENTICATED error, try RefreshToken once.
#   If RefreshToken also fails, redirect to login.
#   Each refresh issues a brand-new pair and invalidates the old refreshToken.
#
# OAuth2 (social login)
# ─────────────────────
#   OAuth2 is a browser redirect flow — not a GraphQL call.
#   Navigate the browser to:
#     /oauth2/authorization/google
#     /oauth2/authorization/github
#     /oauth2/authorization/facebook
#   Tokens arrive as HttpOnly cookies after the redirect back to the frontend.
#   Use linkedAccounts query to see which providers are connected.
