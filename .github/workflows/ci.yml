name: CI

on:
  push:
    branches: [main, dev, 'feature/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY:      ghcr.io
  IMAGE_NAME:    ${{ github.repository }}
  JAVA_VERSION:  '21'
  DISTRIBUTION:  temurin

# Minimal default permissions — each job escalates only what it needs.
permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# JOBS  (follow PRD sequence; parallel where dependencies allow)
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # 1  Validate — compile + style
  # ════════════════════════════════════════════════════════════════════════════
  validate:
    name: Validate (Compile + Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.DISTRIBUTION }}
          cache: maven

      - name: Compile
        run: ./mvnw -B compile --no-transfer-progress

      - name: Checkstyle
        run: ./mvnw -B checkstyle:check --no-transfer-progress

  # ════════════════════════════════════════════════════════════════════════════
  # 2  Dependency Review  (pull-request only)
  # ════════════════════════════════════════════════════════════════════════════
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents:      read
      pull-requests: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity:      high
          comment-summary-in-pr: always

  # ════════════════════════════════════════════════════════════════════════════
  # 3  Dependency Audit — OWASP + Dependabot signals
  # ════════════════════════════════════════════════════════════════════════════
  dependency-audit:
    name: Dependency Audit (OWASP)
    runs-on: ubuntu-latest
    permissions:
      contents:        read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.DISTRIBUTION }}
          cache: maven

      - name: OWASP Dependency-Check
        run: |
          ./mvnw -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -Dformats=SARIF,HTML \
            --no-transfer-progress
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: target/dependency-check-report.sarif
        continue-on-error: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name:           owasp-dependency-report
          path:           target/dependency-check-report.html
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════════════
  # 4  Secret Scanning — Gitleaks
  # ════════════════════════════════════════════════════════════════════════════
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Gitleaks can diff all commits

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # required for private org repos

  # ════════════════════════════════════════════════════════════════════════════
  # 5  SAST — CodeQL (Java)
  # ════════════════════════════════════════════════════════════════════════════
  codeql:
    name: SAST (CodeQL — Java)
    runs-on: ubuntu-latest
    permissions:
      contents:        read
      security-events: write
      actions:         read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.DISTRIBUTION }}
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries:   security-extended,security-and-quality

      - name: Build for CodeQL
        run: ./mvnw -B package -DskipTests --no-transfer-progress

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin

  # ════════════════════════════════════════════════════════════════════════════
  # 6  Unit Tests
  # ════════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     test
          POSTGRES_PASSWORD: test
          POSTGRES_DB:       fynza_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.DISTRIBUTION }}
          cache: maven

      - name: Run unit tests (Surefire)
        run: ./mvnw -B test --no-transfer-progress
        env:
          SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/fynza_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATA_REDIS_HOST:     localhost
          SPRING_DATA_REDIS_PORT:     '6379'
          SPRING_PROFILES_ACTIVE:     test

      - name: Publish unit test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: target/surefire-reports/*.xml
          check_name:   Unit Test Results

      - name: Upload test results + coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════════════
  # 7  Integration Tests  (needs unit-tests; share services pattern)
  # ════════════════════════════════════════════════════════════════════════════
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     test
          POSTGRES_PASSWORD: test
          POSTGRES_DB:       fynza_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.DISTRIBUTION }}
          cache: maven

      - name: Run integration tests (Failsafe)
        run: ./mvnw -B verify -DskipUnitTests --no-transfer-progress
        env:
          SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/fynza_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATA_REDIS_HOST:     localhost
          SPRING_DATA_REDIS_PORT:     '6379'
          SPRING_PROFILES_ACTIVE:     test

      - name: Publish integration test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: target/failsafe-reports/*.xml
          check_name:   Integration Test Results

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name:           integration-test-results
          path:           target/failsafe-reports/
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════════════
  # 8  API Tests  (parallel with integration-tests; activate -Papi-tests profile)
  # ════════════════════════════════════════════════════════════════════════════
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     test
          POSTGRES_PASSWORD: test
          POSTGRES_DB:       fynza_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.DISTRIBUTION }}
          cache: maven

      # Requires the `api-tests` Maven Failsafe profile to be defined in pom.xml.
      # Uses @Tag("api") or a separate src/test/.../api/** glob to isolate HTTP-layer tests.
      - name: Run API tests (Failsafe — api-tests profile)
        run: ./mvnw -B verify -Papi-tests --no-transfer-progress
        env:
          SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/fynza_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATA_REDIS_HOST:     localhost
          SPRING_DATA_REDIS_PORT:     '6379'
          SPRING_PROFILES_ACTIVE:     test
        continue-on-error: true   # remove once api-tests profile is wired up

      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name:           api-test-results
          path:           target/failsafe-reports/
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════════════
  # 9  Database Migration Tests — Liquibase on a clean schema
  # ════════════════════════════════════════════════════════════════════════════
  migration-tests:
    name: DB Migration Tests (Liquibase)
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     test
          POSTGRES_PASSWORD: test
          POSTGRES_DB:       fynza_migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.DISTRIBUTION }}
          cache: maven

      - name: Apply all changesets on clean schema
        run: |
          ./mvnw -B liquibase:update \
            -Dliquibase.url=jdbc:postgresql://localhost:5432/fynza_migration_test \
            -Dliquibase.username=test \
            -Dliquibase.password=test \
            --no-transfer-progress

      - name: Validate applied changesets
        run: |
          ./mvnw -B liquibase:validate \
            -Dliquibase.url=jdbc:postgresql://localhost:5432/fynza_migration_test \
            -Dliquibase.username=test \
            -Dliquibase.password=test \
            --no-transfer-progress

  # ════════════════════════════════════════════════════════════════════════════
  # 10  Build — produce the production artifact
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [validate, unit-tests, integration-tests, migration-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version:  ${{ env.JAVA_VERSION }}
          distribution:  ${{ env.DISTRIBUTION }}
          cache: maven

      - name: Package production JAR
        run: ./mvnw -B package -DskipTests --no-transfer-progress

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name:              app-jar
          path:              target/*.jar
          if-no-files-found: error
          retention-days:    7

  # ════════════════════════════════════════════════════════════════════════════
  # 11  Docker Build  +  15  Container Scan  (combined — image lives in same runner)
  # ════════════════════════════════════════════════════════════════════════════
  docker-build-and-scan:
    name: Docker Build & Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents:        read
      packages:        write
      security-events: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-name:   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Fynza Backend
            org.opencontainers.image.vendor=Fynza

      # On push:        build + push to GHCR   → scan from registry by digest
      # On pull_request: build + load locally  → scan from local Docker daemon
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context:    .
          push:       ${{ github.event_name != 'pull_request' }}
          load:       ${{ github.event_name == 'pull_request' }}
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          provenance: false  # provenance attestation is handled separately

      - name: Resolve image ref for scanning
        id: scan-ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Image loaded locally; use the first metadata tag
            ref=$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -1)
          else
            ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Scan image — Trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref:  ${{ steps.scan-ref.outputs.ref }}
          format:     sarif
          output:     trivy-image.sarif
          severity:   HIGH,CRITICAL
          exit-code:  '1'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category:   container-scan

      - name: Upload Trivy report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name:           trivy-image-report
          path:           trivy-image.sarif
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════════════
  # 16  SBOM  (push events only — image must be in registry)
  # ════════════════════════════════════════════════════════════════════════════
  sbom:
    name: Generate SBOM (Syft / SPDX)
    runs-on: ubuntu-latest
    needs: docker-build-and-scan
    if: github.event_name != 'pull_request'
    permissions:
      contents:  read
      packages:  read
      id-token:  write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM from container image
        uses: anchore/sbom-action@v0
        with:
          image:         ${{ needs.docker-build-and-scan.outputs.image-name }}@${{ needs.docker-build-and-scan.outputs.image-digest }}
          artifact-name: sbom-${{ github.sha }}.spdx.json
          output-file:   sbom.spdx.json
          format:        spdx-json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name:           sbom
          path:           sbom.spdx.json
          retention-days: 90

  # ════════════════════════════════════════════════════════════════════════════
  # 17  Artifact Provenance  (SLSA level 2 via GitHub's built-in attestation)
  # ════════════════════════════════════════════════════════════════════════════
  provenance:
    name: Artifact Provenance
    runs-on: ubuntu-latest
    needs: [build, docker-build-and-scan]
    if: github.event_name != 'pull_request'
    permissions:
      contents:     write
      actions:      read
      id-token:     write
      packages:     write
      attestations: write
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Attest JAR provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/*.jar

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name:    ${{ needs.docker-build-and-scan.outputs.image-name }}
          subject-digest:  ${{ needs.docker-build-and-scan.outputs.image-digest }}
          push-to-registry: true

  # ════════════════════════════════════════════════════════════════════════════
  # 18  Sign image — Cosign keyless (OIDC, no long-lived keys)
  # ════════════════════════════════════════════════════════════════════════════
  sign-image:
    name: Sign Image (Cosign — keyless)
    runs-on: ubuntu-latest
    needs: [docker-build-and-scan, sbom]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image (keyless OIDC)
        run: |
          cosign sign --yes \
            "${{ needs.docker-build-and-scan.outputs.image-name }}@${{ needs.docker-build-and-scan.outputs.image-digest }}"

      - name: Attach SBOM to image in registry
        run: |
          cosign attach sbom \
            --sbom sbom.spdx.json \
            "${{ needs.docker-build-and-scan.outputs.image-name }}@${{ needs.docker-build-and-scan.outputs.image-digest }}"

  # ════════════════════════════════════════════════════════════════════════════
  # 19  Upload CI artifacts  (test reports + coverage already uploaded above;
  #      this job consolidates the security summary for the PR/commit)
  # ════════════════════════════════════════════════════════════════════════════
  upload-security-summary:
    name: Upload Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, docker-build-and-scan]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Download all security artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*report*'
          merge-multiple: true
          path: security-reports/

      - name: Upload consolidated security reports
        uses: actions/upload-artifact@v4
        with:
          name:           security-reports
          path:           security-reports/
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════════════
  # 20  CI Complete — required-checks gate
  #     All required jobs must be success (or skipped for event-gated jobs).
  #     This is the single status check referenced in branch protection rules.
  # ════════════════════════════════════════════════════════════════════════════
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate
      - dependency-review       # skipped on push — OK
      - dependency-audit
      - secret-scan
      - codeql
      - unit-tests
      - integration-tests
      - api-tests               # continue-on-error upstream; gate treats skipped as OK
      - migration-tests
      - build
      - docker-build-and-scan
      - sbom                    # skipped on PR — OK
      - provenance              # skipped on PR — OK
      - sign-image              # skipped on PR — OK
      - upload-security-summary
    steps:
      - name: Verify all required checks passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Jobs that are intentionally skipped for certain event types are acceptable.
          # Only a hard failure or cancellation on a required job blocks the merge.
          OPTIONAL='dependency-review sbom provenance sign-image api-tests'

          echo "$NEEDS_JSON" | python3 - <<'PYEOF'
          import json, os, sys

          needs    = json.loads(os.environ["NEEDS_JSON"])
          optional = set(os.environ["OPTIONAL"].split())

          failed = [
              name for name, job in needs.items()
              if job["result"] not in ("success", "skipped")
              and name not in optional
          ]

          if failed:
              print(f"Required CI jobs failed or were cancelled: {failed}", file=sys.stderr)
              sys.exit(1)

          print("All required CI checks passed. Trusted artifact is ready for CD.")
          PYEOF
