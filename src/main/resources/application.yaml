spring:
  application:
    name: fynza-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
  graphql:
    schema:
      locations: classpath:graphql/**/
      file-extensions: .graphqls
    http:
      path: /graphql
    graphiql:
      enabled: true
      path: /graphiql
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:10MB}
      max-request-size: ${STORAGE_MAX_REQUEST_SIZE:12MB}
  data:
    redis:
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: "${REDIS_POOL_MAX_WAIT:-1ms}"

fynza:
  notifications-enabled: ${NOTIFICATIONS_ENABLED:true}
  public-app-base-url: ${PUBLIC_APP_BASE_URL:http://localhost:3000}
  mail:
    gmail:
      host: ${GMAIL_HOST:smtp.gmail.com}
      port: ${GMAIL_PORT:587}
      username: ${GMAIL_USERNAME:}
      password: ${GMAIL_APP_PASSWORD:}
    microsoft:
      host: ${MAIL_HOST:smtp.office365.com}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      encryption: ${MAIL_ENCRYPTION:tls}
    mailtrap:
      token: ${MAILTRAP_TOKEN:}
      inbox-id: ${MAILTRAP_INBOX_ID:0}
  notification:
    email:
      from: ${MAIL_FROM:${GMAIL_USERNAME:}}
      from-name: ${NOTIFICATION_FROM_NAME:Fynza}
    slack:
      bot-token: ${SLACK_BOT_TOKEN:}
      api-base-url: ${SLACK_API_BASE_URL:https://slack.com/api}
    retry-job:
      cron: ${NOTIFICATION_RETRY_CRON:0 */2 * * * *}
  media:
    provider:
      primary: ${MEDIA_PROVIDER:R2}
      routing-strategy: PRIMARY_ONLY
      r2:
        access-key-id: ${R2_ACCESS_KEY_ID:}
        secret-access-key: ${R2_SECRET_ACCESS_KEY:}
        endpoint: ${R2_ENDPOINT:}
        bucket: ${R2_BUCKET:fynza-media}
        cdn-base-url: ${R2_CDN_BASE_URL:}
        presigned-url-expiry-seconds: ${R2_PRESIGNED_EXPIRY:600}
      s3:
        access-key-id: ${S3_ACCESS_KEY_ID:}
        secret-access-key: ${S3_SECRET_ACCESS_KEY:}
        region: ${S3_REGION:us-east-1}
        bucket: ${S3_BUCKET:fynza-media}
        cdn-base-url: ${S3_CDN_BASE_URL:}
        presigned-url-expiry-seconds: ${S3_PRESIGNED_EXPIRY:600}
      supabase:
        url: ${SUPABASE_URL:}
        service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
        bucket: ${SUPABASE_BUCKET:fynza-media}
        cdn-base-url: ${SUPABASE_CDN_BASE_URL:}
        signed-url-expiry-seconds: ${SUPABASE_SIGNED_URL_EXPIRY:600}
      cloudinary:
        cloud-name: ${CLOUDINARY_CLOUD_NAME:}
        api-key: ${CLOUDINARY_API_KEY:}
        api-secret: ${CLOUDINARY_API_SECRET:}
        upload-preset: ${CLOUDINARY_UPLOAD_PRESET:}
        cdn-base-url: ${CLOUDINARY_CDN_BASE_URL:}
        signed-url-expiry-seconds: ${CLOUDINARY_SIGNED_URL_EXPIRY:600}
      firebase:
        project-id: ${FIREBASE_PROJECT_ID:}
        bucket: ${FIREBASE_BUCKET:}
        service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
        cdn-base-url: ${FIREBASE_CDN_BASE_URL:}
      local:
        storage-dir: ${LOCAL_STORAGE_DIR:./media-storage}
        base-url: ${LOCAL_BASE_URL:http://localhost:8080/media/files}
        upload-api-url: ${LOCAL_UPLOAD_API_URL:http://localhost:8080}
    upload:
      max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE:10485760}
      max-width-pixels: 8000
      max-height-pixels: 8000
      session-ttl-minutes: ${MEDIA_SESSION_TTL_MINUTES:15}
      session-expiry-check-ms: ${MEDIA_SESSION_EXPIRY_CHECK_MS:300000}
    quota:
      default-seller-quota-bytes: ${MEDIA_DEFAULT_QUOTA:2147483648}
  payment:
    provider: ${PAYMENT_PROVIDER:paystack}
    paystack:
      secret-key: ${PAYSTACK_SECRET_KEY:}
      public-key: ${PAYSTACK_PUBLIC_KEY:}
      base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
      webhook-secret: ${PAYSTACK_WEBHOOK_SECRET:}
      connect-timeout: ${PAYSTACK_CONNECT_TIMEOUT:30000}
      read-timeout: ${PAYSTACK_READ_TIMEOUT:30000}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      public-key: ${STRIPE_PUBLIC_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      base-url: ${STRIPE_BASE_URL:https://api.stripe.com}
      connect-timeout: ${STRIPE_CONNECT_TIMEOUT:30000}
      read-timeout: ${STRIPE_READ_TIMEOUT:30000}
    paypal:
      client-id: ${PAYPAL_CLIENT_ID:}
      client-secret: ${PAYPAL_CLIENT_SECRET:}
      webhook-id: ${PAYPAL_WEBHOOK_ID:}
      sandbox: ${PAYPAL_SANDBOX:false}
      base-url: ${PAYPAL_BASE_URL:https://api-m.paypal.com}
      connect-timeout: ${PAYPAL_CONNECT_TIMEOUT:30000}
      read-timeout: ${PAYPAL_READ_TIMEOUT:30000}
    flutterwave:
      secret-key: ${FLUTTERWAVE_SECRET_KEY:}
      public-key: ${FLUTTERWAVE_PUBLIC_KEY:}
      encryption-key: ${FLUTTERWAVE_ENCRYPTION_KEY:}
      webhook-secret: ${FLUTTERWAVE_WEBHOOK_SECRET:}
      base-url: ${FLUTTERWAVE_BASE_URL:https://api.flutterwave.com/v3}
      connect-timeout: ${FLUTTERWAVE_CONNECT_TIMEOUT:30000}
      read-timeout: ${FLUTTERWAVE_READ_TIMEOUT:30000}
  cache:
    redis:
      default-ttl: 15m
      token-blacklist-ttl: 24h
      user-token-version-ttl: 24h
    circuit-breaker:
      failure-threshold: 5
      wait-duration: 30s
      half-open-requests: 3

jwt:
  cache:
    max-size: 10000
    expire-after-write-minutes: 10
    expire-after-access-minutes: 5
  bloom-filter:
    expected-insertions: 50000
    fpp: 0.001

seller:
  suspension-expiry:
    cron: ${SELLER_SUSPENSION_EXPIRY_CRON:0 0 * * * *}

rate-limit:
  enabled: ${ENABLE_RATE_LIMITING:false}
  login:
    max-requests: ${MAX_LOGIN_REQUESTS:10}
    window-seconds: ${LOGIN_REQUESTS_WINDOW:60}
  api:
    max-requests: ${MAX_API_REQUESTS:100}
    window-seconds: ${API_REQUESTS_WINDOW:60}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  frontend-success-redirect: ${FRONTEND_URL:http://localhost:3000}/auth/oauth2/callback
  frontend-failure-redirect: ${FRONTEND_URL:http://localhost:3000}/auth/login
  cookie:
    secure: ${COOKIE_SECURE:false}
  token:
    access-minutes: ${TOKEN_ACCESS_MINUTES:15}
    refresh-days: ${TOKEN_REFRESH_DAYS:7}
    email-verification-hours: ${TOKEN_EMAIL_VERIFICATION_HOURS:24}
    password-reset-minutes: ${TOKEN_PASSWORD_RESET_MINUTES:15}
    mfa-challenge-minutes: ${TOKEN_MFA_CHALLENGE_MINUTES:5}

server:
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: true
      directory: ${LOG_ACCESS_FILE_DIRECTORY:}
      prefix: ${SERVER_ACCESS_LOG_PREFIX:}
      suffix: .log
      pattern: '%h %l %u %t "%r" %s %b %D'
      rotate: true
      file-date-format: .yyyy-MM-dd
      rename-on-rotate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: fynza-backend
      environment: ${SPRING_PROFILES_ACTIVE:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true

logging:
  file:
    name: ${LOG_FILE_NAME:}
  level:
    root: INFO
