spring:
  application:
    name: fynza-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
  graphql:
    schema:
      locations: classpath:graphql/**/
      file-extensions: .graphqls
    http:
      path: /graphql
    graphiql:
      enabled: true
      path: /graphiql
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:10MB}
      max-request-size: ${STORAGE_MAX_REQUEST_SIZE:12MB}
  data:
    redis:
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: "${REDIS_POOL_MAX_WAIT:-1ms}"
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m,recordStats
    cache-names: products,categories,carts,users,reviews,orders

fynza:
  notifications-enabled: ${NOTIFICATIONS_ENABLED:true}
  public-app-base-url: ${PUBLIC_APP_BASE_URL:http://localhost:3000}
  mail:
    gmail:
      host: ${GMAIL_HOST:smtp.gmail.com}
      port: ${GMAIL_PORT:587}
      username: ${GMAIL_USERNAME:}
      password: ${GMAIL_APP_PASSWORD:}
    microsoft:
      host: ${MAIL_HOST:smtp.office365.com}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      encryption: ${MAIL_ENCRYPTION:tls}
    mailtrap:
      token: ${MAILTRAP_TOKEN:}
      inbox-id: ${MAILTRAP_INBOX_ID:0}
  notification:
    email:
      from: ${MAIL_FROM:${GMAIL_USERNAME:}}
      from-name: ${NOTIFICATION_FROM_NAME:Fynza}
    slack:
      bot-token: ${SLACK_BOT_TOKEN:}
      api-base-url: ${SLACK_API_BASE_URL:https://slack.com/api}
    retry-job:
      cron: ${NOTIFICATION_RETRY_CRON:0 */2 * * * *}

rate-limit:
  enabled: ${ENABLE_RATE_LIMITING:false}
  login:
    max-requests: ${MAX_LOGIN_REQUESTS:10}
    window-seconds: ${LOGIN_REQUESTS_WINDOW:60}
  api:
    max-requests: ${MAX_API_REQUESTS:100}
    window-seconds: ${API_REQUESTS_WINDOW:60}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  frontend-success-redirect: ${FRONTEND_URL:http://localhost:3000}/auth/oauth2/callback
  frontend-failure-redirect: ${FRONTEND_URL:http://localhost:3000}/auth/login
  cookie:
    secure: ${COOKIE_SECURE:false}

server:
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: true
      directory: ${LOG_ACCESS_FILE_DIRECTORY:}
      prefix: ${SERVER_ACCESS_LOG_PREFIX:}
      suffix: .log
      pattern: '%h %l %u %t "%r" %s %b %D'
      rotate: true
      file-date-format: .yyyy-MM-dd
      rename-on-rotate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: fynza-backend
      environment: ${SPRING_PROFILES_ACTIVE:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true

logging:
  file:
    name: ${LOG_FILE_NAME:}
  level:
    root: INFO
