spring:
  graphql:
    graphiql:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FynzaHikariCP-Staging
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 840000
      keepalive-time: 30000
      validation-timeout: 5000
      auto-commit: false
      initialization-fail-timeout: 1

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true

server:
  port: ${SERVER_PORT:9190}
  servlet:
    context-path: /api
  forward-headers-strategy: framework

cors:
  allowed-origins: ${ALLOWED_ORIGINS}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  max-age: 3600

jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration: 900000
  refresh-token:
    expiration: 604800000
  blacklist:
    max-size: 10000
    expire-after-write-hours: 24
  cache:
    max-size: 10000
    expire-after-write-minutes: 10
    expire-after-access-minutes: 5

paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  mode: sandbox

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY}
  public-key: ${PAYSTACK_PUBLIC_KEY}
  base-url: https://api.paystack.co
  webhook-secret: ${PAYSTACK_WEBHOOK_SECRET}

fynza:
  notification:
    email:
      provider: ${MAIL_PROVIDER:mailtrap}

logging:
  level:
    ecommerce: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true
