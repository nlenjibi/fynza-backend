spring:
  datasource:
    url: jdbc:h2:mem:aoms_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=PostgreSQL
    username: sa
    password:
  liquibase:
    enabled: false
  session:
    store-type: none
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

auth:

  session-expiry-seconds: 3600

arm:
  graphql-url: https://test.arm.example.com/graphql
  cache-ttl-seconds: 300
  timeout-ms: 1500
  role-mappings:
    Manager: ROLE_MANAGER
    HR: ROLE_HR
    intern: ROLE_INTERN
    full_time: ROLE_EMPLOYEE

cors:
  allowed-origins: "http://localhost:3000"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  max-age: 3600

server:
  port: 0
