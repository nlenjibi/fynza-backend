spring:
  liquibase:
    enabled: false
  session:
    servlet:
      cookie:
        secure: false

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true

server:
  port: ${SERVER_PORT}

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:8080
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  max-age: 3600

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    # Allow Swagger UI to send cookies with requests (for session-based auth)
    persistent-auth-data: true  # Persist auth data in browser storage
    enable-oidc-discovery: false  # Disable OIDC as we use session cookies
    # These properties ensure cookies are sent with cross-origin requests
    operations-sorter: method  # Sort operations by HTTP method
