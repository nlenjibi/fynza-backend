spring:
  liquibase:
    enabled: true
  session:
    servlet:
      cookie:
        secure: true  # Enforce HTTPS in production
        # Frontend must include credentials: fetch(..., { credentials: 'include' })
        # or Axios: axios({ withCredentials: true })

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT}

cors:
  allowed-origins: ${ALLOWED_ORIGINS}  # Set via environment variables for production
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  max-age: 3600

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    persistent-auth-data: true
    enable-oidc-discovery: false
    operations-sorter: method

